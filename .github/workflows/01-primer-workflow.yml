name: 01 - Mi primer workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar mensaje
        run: echo "Hola mundo, esta es mi práctica 9"
      - name: Mostrar contexto básico
        run: echo "Evento=$GITHUB_EVENT_NAME Rama=$GITHUB_REF_NAME"
      - name: Mostrar versión de Node
        run: node --version
